<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Mi primera experiencia AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #aviso {
      position: fixed; top: 12px; left: 12px; right: 12px;
      z-index: 10; padding: 10px; border-radius: 8px;
      background: #153451; color: white;
      font: 16px Arial, sans-serif; text-align: center;
      pointer-events: none;
      transition: opacity .3s;
    }
    #aviso.oculto { opacity: 0; }
    #aviso.error { background: #9b1c1c; }
  </style>
</head>
<body>
  <div id="aviso">Autoriza la cámara y apunta a la imagen del dinosaurio</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets timeout="30000">
      <!-- Modelo 3D optimizado (3.9 MB) -->
      <a-asset-item id="dino" src="./dinosaurio.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0"
              look-controls="enabled: false"></a-camera>

    <!-- Luces para que el modelo no se vea oscuro -->
    <a-light type="ambient" intensity="1"></a-light>
    <a-light type="directional" intensity="1.5" position="1 2 3"></a-light>

    <!-- targetIndex 0 = marcador.png (compilado en targets.mind) -->
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- La tarjeta mide 1 de ancho: ajusta scale para hacer el dinosaurio más grande o más chico -->
      <a-gltf-model src="#dino"
                    rotation="10 -40 0"
                    position="0 -0.3 0.05"
                    scale="0.75 0.75 0.75"></a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    // Oculta el aviso cuando se detecta el target y lo muestra cuando se pierde.
    const aviso = document.getElementById('aviso');
    const escena = document.querySelector('a-scene');
    const target = document.getElementById('target');

    escena.addEventListener('arReady', () => {
      aviso.textContent = 'Apunta la cámara al target';
    });
    escena.addEventListener('arError', () => {
      aviso.classList.add('error');
      aviso.classList.remove('oculto');
      aviso.textContent = 'No se pudo abrir la cámara. Revisa los permisos y abre la página con https.';
    });
    target.addEventListener('targetFound', () => aviso.classList.add('oculto'));
    target.addEventListener('targetLost', () => {
      aviso.textContent = 'Target perdido: vuelve a apuntar la cámara';
      aviso.classList.remove('oculto');
    });
  </script>
</body>
</html>
